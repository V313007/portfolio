<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio Kỹ năng số</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1f44;--surface:#102a58;--ink:#ffffff;--muted:#c5d3ea;--line:#2d4a7e;--brand:#ffffff;--brand-ink:#0a1f44;--accent:#ffd166;--soft:#183a72;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}


html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.65 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{min-height:100vh;display:flex;flex-direction:column}
aside{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;padding:calc(12px + env(safe-area-inset-top,0px)) clamp(16px,4vw,40px) 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;text-decoration:none}
.brand i{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-style:normal;font-weight:800}
nav{display:flex;gap:4px;align-items:center;margin-left:auto}
nav a,nav .dd>button{padding:9px 14px;border-radius:10px;text-decoration:none;color:var(--muted);font:inherit;font-weight:500;font-size:15px;background:none;border:0;cursor:pointer;display:block;text-align:left}
nav a:hover,nav .dd>button:hover{background:var(--soft);color:var(--ink)}
nav a.on,nav .dd>button.on{background:var(--soft);color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}
.dd{position:relative}
.dd-menu{display:none;position:absolute;top:calc(100% + 10px);right:0;min-width:380px;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.dd.open .dd-menu{display:flex}
.dd>button span{display:inline-block;margin-left:4px;transition:transform .2s}
.dd.open>button span{transform:rotate(180deg)}
.foot{margin-top:auto;font-size:13px;color:var(--muted)}
.menu{display:none}
main{padding:56px clamp(20px,5vw,72px) 72px;max-width:1000px;width:100%;margin:0 auto}
h1{font-size:clamp(30px,5vw,48px);line-height:1.15;margin:0 0 14px;letter-spacing:-.02em;font-weight:800}
h2{font-size:22px;margin:40px 0 12px;font-weight:700}
h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 14px;max-width:68ch}
.lead{font-size:19px;color:var(--muted)}
.hero{display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:center;padding:8px 0 20px}
.avatar{width:200px;height:200px;border-radius:50%;background:var(--soft);border:6px solid var(--surface);box-shadow:0 0 0 3px var(--accent);display:grid;place-items:center;overflow:hidden;font-size:56px;font-weight:800;color:var(--brand)}
.avatar img{width:100%;height:100%;object-fit:cover}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.fact b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.list{display:grid;gap:12px;margin-top:18px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none}
.item:hover{border-color:var(--brand)}
.item .n{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800}
.item small{color:var(--muted);display:block}
.pts{font-weight:700;color:var(--brand);white-space:nowrap}
.btn{display:inline-block;padding:11px 20px;border-radius:999px;background:var(--brand);color:var(--brand-ink);text-decoration:none;font-weight:600;border:0;cursor:pointer;font:inherit;font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}
.crumb{font-size:14px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--brand);font-weight:600}
.badge{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600;color:var(--brand)}
.slot{border:2px dashed var(--line);border-radius:14px;padding:30px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.slot b{display:block;color:var(--ink);margin-bottom:4px}
.fig{margin:8px 0 0}
.fig img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
.sec{border-left:4px solid var(--accent);padding-left:18px;margin-top:30px}
.sec h2{margin-top:0}
ul{padding-left:20px;margin:0 0 14px}li{margin:4px 0}
.themebtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;align-self:flex-start}
@media (max-width:860px){
aside{flex-wrap:wrap;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.menu{display:block;margin-left:auto;background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:600}
aside nav{display:none;width:100%;flex-direction:column;align-items:stretch;margin-left:0}
aside.open nav{display:flex}
.dd-menu{position:static;min-width:0;box-shadow:none;border:0;padding:0 0 0 14px;margin-top:2px}
.hero{grid-template-columns:1fr;justify-items:start;gap:20px}
.avatar{width:150px;height:150px;font-size:42px}
.item{grid-template-columns:40px 1fr}.item .pts{grid-column:2}
main{padding-top:32px}
}
.wrap{overflow-x:auto;margin:12px 0 18px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
.tbl th,.tbl td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
.tbl th{background:var(--soft)}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:13.5px}
pre.tree{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;overflow-x:auto;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;margin:8px 0 18px}
.vid{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;margin:8px 0}
.vid:hover{border-color:var(--accent)}
.vid .play{width:54px;height:54px;border-radius:50%;background:#e53935;color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.vid small{display:block;color:var(--muted)}
main{flex:1 0 auto}
aside{flex:none}
.site-foot{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.site-foot b{color:var(--ink);font-size:16px}
</style>
</head>

<h3>Quy tắc đặt tên</h3><ul><li>Tiền tố theo loại việc, rồi dấu gạch dưới và tên sinh viên: ThucHanh_VuSyTuan.</li><li>Viết hoa chữ cái đầu mỗi từ, không dấu, không khoảng trắng.</li><li>Tên tệp thể hiện nội dung: GhiChuQuanTrong.txt.</li></ul>
<h3>Ảnh minh họa các bước thực hiện</h3><figure class="fig"><img src="${IMG1}" alt="Hướng dẫn 10 bước thao tác tệp tin và thư mục trên Windows 11 File Explorer"></figure>`,noslot:true,kk:"Thông qua bài tập này, em nhận thấy khó khăn chủ yếu xuất phát từ việc chưa thường xuyên sử dụng và chưa thành thạo các thao tác quản lý tệp tin trên máy tính. Sau khi tìm hiểu hướng dẫn và trực tiếp thực hành, em đã hiểu rõ hơn cách tổ chức, sắp xếp và quản lý dữ liệu."},
{g:"Tìm kiếm tài liệu học thuật bằng toán tử nâng cao và đánh giá độ tin cậy của nguồn.",tl:"Google để tra cứu",nokk:1,
st:`<ol><li>Chọn chủ đề nghiên cứu: Ứng dụng công nghệ số trong dạy học Âm nhạc ở trường phổ thông.</li><li>Tìm trên Google Scholar, CSDL thư viện trường, tạp chí chuyên ngành, sách chuyên khảo và nguồn mở.</li><li>Thu thập ít nhất 10 tài liệu, trong đó có 5 bài báo khoa học.</li><li>Đánh giá theo 5 tiêu chí, xếp hạng và lập danh mục theo Harvard.</li></ol>`,
viz:`<h3>Toán tử tìm kiếm nâng cao</h3><div class="wrap"><table class="tbl"><tr><th>Toán tử</th><th>Công dụng</th><th>Ví dụ</th></tr><tr><td><code>"..."</code></td><td>Khớp đúng cụm từ</td><td><code>"giáo dục âm nhạc"</code></td></tr><tr><td><code>site:</code></td><td>Giới hạn tên miền</td><td><code>âm nhạc học đường site:edu.vn</code></td></tr><tr><td><code>filetype:</code></td><td>Lọc định dạng tệp</td><td><code>phương pháp Kodály filetype:pdf</code></td></tr><tr><td><code>OR</code></td><td>Một trong hai từ khóa</td><td><code>"dạy hát" OR "thanh nhạc"</code></td></tr><tr><td><code>-</code></td><td>Loại trừ từ khóa</td><td><code>piano -quảng cáo</code></td></tr></table></div>
<h3>Bảng đánh giá nguồn tin</h3><figure class="fig"><img src="${IMG2}" alt="Bảng tổng hợp các nguồn thông tin và đánh giá xếp hạng độ tin cậy"></figure><h3>Kết quả tìm kiếm</h3><figure class="fig"><img src="${IMG3}" alt="Ảnh chụp kết quả tìm kiếm trên Google Scholar với các toán tử nâng cao"></figure>`,noslot:1},
{g:"Viết và cải tiến Prompt cho ba tác vụ học tập, so sánh kết quả đầu ra từ AI.",tl:AI,nokk:1,
st:`<ol><li>Chọn 3 tác vụ: tóm tắt tài liệu, giải thích khái niệm, tạo bộ câu hỏi ôn tập.</li><li>Viết 2 phiên bản Prompt cho mỗi tác vụ: ban đầu và cải tiến.</li><li>Chạy thử trên công cụ AI, so sánh kết quả và phân tích lý do.</li><li>Tổng hợp nguyên tắc viết Prompt hiệu quả.</li></ol>`,
viz:`<h3>Bảng so sánh Prompt</h3><div class="wrap"><table class="tbl"><tr><th>Tác vụ</th><th>Prompt ban đầu</th><th>Prompt cải tiến</th></tr>
<tr><td>Tóm tắt tài liệu</td><td>Tóm tắt bài này.</td><td>Tóm tắt bài báo về giáo dục âm nhạc dưới đây trong 5 gạch đầu dòng: mục tiêu, phương pháp, kết quả.</td></tr>
<tr><td>Giải thích khái niệm</td><td>Giải thích hòa âm.</td><td>Giải thích hòa âm cho sinh viên năm nhất, tối đa 200 từ, kèm 1 ví dụ.</td></tr>
<tr><td>Bộ câu hỏi ôn tập</td><td>Tạo câu hỏi về nhạc lý.</td><td>Tạo 10 câu trắc nghiệm về cung và quãng, 4 đáp án, có đáp án đúng và giải thích.</td></tr></table></div>
<h3>Kết quả đầu ra từ AI cho từng Prompt</h3><figure class="fig"><img src="${IMG4}" alt="Kết quả Gemini tạo bộ câu hỏi nhạc lý từ Prompt ban đầu"></figure><figure class="fig"><img src="${IMG5}" alt="Kết quả Gemini tạo 10 câu trắc nghiệm về cung và quãng từ Prompt cải tiến"></figure>
<h3>Nguyên tắc rút ra</h3><ul><li>Giao vai trò rõ ràng cho AI.</li><li>Nêu ngữ cảnh và đối tượng người học.</li><li>Quy định định dạng và độ dài đầu ra.</li><li>Cho ví dụ mẫu và yêu cầu suy luận từng bước.</li></ul>`,noslot:1},
{g:"Lập kế hoạch, tổ chức cuộc họp trực tuyến cho dự án nhóm và tổng kết sau họp.",notl:1,nokk:1,
st:`<ol><li>Cùng nhóm chọn chủ đề thảo luận và nền tảng họp (Google Meet, Zoom hoặc Teams).</li><li>Lập kế hoạch: mục tiêu, nghị sự, phân vai, tài liệu.</li><li>Họp 20 đến 30 phút, ghi lại khi được các thành viên đồng ý.</li><li>Lập biên bản, chia sẻ tài liệu, mỗi người viết đánh giá ngắn.</li></ol>`,
viz:`<h3>Khung kế hoạch cuộc họp</h3><div class="wrap"><table class="tbl"><tr><th>Hạng mục</th><th>Nội dung</th></tr><tr><td>Nền tảng</td><td>[Google Meet / Zoom / Teams]</td></tr><tr><td>Mục tiêu</td><td>Thảo luận về đề tài nghiên cứu khoa học</td></tr><tr><td>Nghị sự</td><td>3 phút mở đầu, 15 phút thảo luận, 7 phút chốt nhiệm vụ</td></tr><tr><td>Vai trò</td><td>Phân công nhiệm vụ cho từng cá nhân, gồm người tìm kiếm thông tin, người trình bày, v.v.</td></tr><tr><td>Sau họp</td><td>Biên bản, danh sách nhiệm vụ, chia sẻ tài liệu, đánh giá cá nhân</td></tr></table></div><h3>Công cụ quản lý dự án nhóm</h3><div class="wrap"><table class="tbl"><tr><th>Cột công việc</th><th>Ý nghĩa</th></tr><tr><td>Cần làm</td><td>Nhiệm vụ chưa bắt đầu, ghi người phụ trách và hạn</td></tr><tr><td>Đang làm</td><td>Nhiệm vụ đang thực hiện</td></tr><tr><td>Hoàn thành</td><td>Nhiệm vụ đã xong và được kiểm tra</td></tr></table></div><ul><li>Công cụ quản lý: [Trello / Notion / Google Tasks]</li><li>Cách phối hợp: họp qua [Meet / Zoom], trao đổi qua [Zalo / Messenger], tài liệu chung trên Google Drive.</li></ul>`,noslot:1},

var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var initials=ME.name.replace(/[\[\]]/g,"").split(" ").slice(-1)[0].charAt(0).toUpperCase()||"N";
$("logo").textContent=initials;$("brandname").textContent=ME.name;
function avatar(){return '<div class="avatar">'+(ME.avatar?'<img src="'+esc(ME.avatar)+'" alt="Ảnh đại diện của '+esc(ME.name)+'">':initials)+'</div>'}
function buildNav(cur){
  var h='<a href="#about" class="'+(cur=="about"?"on":"")+'">Giới thiệu</a>';
  h+='<div class="dd"><button type="button" id="ddbtn" aria-expanded="false" class="'+(cur=="projects"||cur.indexOf("bai-")==0?"on":"")+'">Dự án <span aria-hidden="true">▾</span></button><div class="dd-menu"><a href="#projects" class="'+(cur=="projects"?"on":"")+'">Tổng quan dự án</a>';
  EX.forEach(function(e,i){h+='<a class="'+(cur=="bai-"+(i+1)?"on":"")+'" href="#bai-'+(i+1)+'">Bài '+(i+1)+': '+esc(e.t)+'</a>'});h+='</div></div>';
  h+='<a href="#conclusion" class="'+(cur=="conclusion"?"on":"")+'">Tổng kết</a>';
  $("nav").innerHTML=h;
}
function about(){return '<div class="hero">'+avatar()+'<div><h1>Xin chào, mình là '+esc(ME.name)+'</h1><p class="lead">Sinh viên ngành '+esc(ME.major)+', lớp '+esc(ME.cls)+', '+esc(ME.school)+'. Đây là nơi mình lưu giữ và trình bày các sản phẩm của học phần Kỹ năng số.</p><div class="row" style="margin-top:8px"><a class="btn" href="#projects">Xem các dự án</a><a class="btn alt" href="#conclusion">Đọc tổng kết</a></div></div></div>'
+'<div class="facts"><div class="fact"><b>Họ và tên</b>'+esc(ME.name)+'</div><div class="fact"><b>Ngành học</b>'+esc(ME.major)+'</div><div class="fact"><b>Trường</b>'+esc(ME.school)+'</div><div class="fact"><b>Lớp</b>'+esc(ME.cls)+'</div><div class="fact"><b>Mã sinh viên</b>'+esc(ME.id)+'</div><div class="fact"><b>Sở thích</b>'+esc(ME.hobby)+'</div></div>'
+'<div class="sec"><h2>Mục tiêu học tập và định hướng phát triển</h2><p>Mình muốn nắm vững kiến thức chuyên môn âm nhạc và nghiệp vụ sư phạm, đồng thời rèn luyện kỹ năng số để ứng dụng công nghệ và AI vào soạn giáo án, thiết kế bài giảng và sáng tạo nội dung âm nhạc. Về lâu dài, mình hướng tới trở thành giáo viên âm nhạc biết đổi mới phương pháp dạy học và truyền cảm hứng cho học sinh.</p></div>'
+'<div class="sec"><h2>Mục tiêu của Portfolio</h2><ul><li>Thể hiện các kỹ năng số đã học trong học phần.</li><li>Lưu trữ sản phẩm cá nhân để dễ truy cập và chia sẻ.</li><li>Làm nền tảng giới thiệu năng lực với giảng viên và nhà tuyển dụng sau này.</li></ul></div>'}
function projects(){var h='<h1>Dự án</h1><p class="lead">Sáu bài tập của học phần, mỗi bài có một trang riêng gồm mục tiêu, quá trình thực hiện và sản phẩm cuối cùng.</p><div class="list">';
  EX.forEach(function(e,i){h+='<a class="item" href="#bai-'+(i+1)+'"><span class="n">'+(i+1)+'</span><span><b>'+esc(e.t)+'</b><small>'+esc(e.c)+'</small></span><span class="pts">'+e.p+' điểm</span></a>'});
  return h+'</div>'}
function bsec(i){var x=X[i]||{};if(x.nob)return"";if(x.onlytl)return'<div class="sec"><h2>b) Công cụ đã dùng</h2><p>'+esc(x.tl||"Gemini")+'</p></div>';return'<div class="sec"><h2>b) Tóm tắt quá trình thực hiện</h2><ul><li><b>Các bước thực hiện:</b> '+(x.st||"[Bổ sung sau]")+'</li>'+(x.notl?"":'<li><b>Công cụ đã dùng:</b> '+(x.tl||"Gemini")+'</li>')+(x.nokk?"":'<li><b>Khó khăn và cách giải quyết:</b> '+(x.kk||"[Bổ sung sau]")+'</li>')+'</ul></div>'}
function ex(i){var e=EX[i],n=i+1;
  var h='<div class="crumb"><a href="#projects">Dự án</a> / Bài '+n+'</div><span class="badge">'+esc(e.c)+'</span><h1 style="margin-top:12px">Bài '+n+': '+esc(e.t)+'</h1>'
  +'<div class="sec"><h2>a) Mục tiêu bài tập</h2><p>'+esc((X[i]||{}).g||"[Nêu yêu cầu của bài tập.]")+' Kỹ năng được rèn luyện: '+esc(e.skill)+'.</p></div>'
  +bsec(i)
  +'<div class="sec"><h2>'+((X[i]||{}).nob?"b)":"c)")+' Sản phẩm cuối cùng</h2><p>Yêu cầu: '+esc(e.prod)+'.</p>'+((X[i]||{}).viz||"")+((X[i]||{}).noslot?"":'<div class="slot"><b>'+esc(e.slot)+'</b>Thay bằng ảnh chụp màn hình thật hoặc liên kết công khai</div>')+'</div>'
  +'<div class="pager">'+(i>0?'<a class="btn alt" href="#bai-'+i+'">← Bài '+i+'</a>':'<a class="btn alt" href="#projects">← Về trang Dự án</a>')
  +(i<5?'<a class="btn" href="#bai-'+(n+1)+'">Bài '+(n+1)+' →</a>':'<a class="btn" href="#conclusion">Đến trang Tổng kết →</a>')+'</div>';
  return h}
function conclusion(){var h='<h1>Tổng kết</h1><p class="lead">Nhìn lại hành trình xây dựng Portfolio và những gì mình học được.</p>'
+'<div class="sec"><h2>Trải nghiệm và cảm nhận cá nhân</h2><p>Thực hiện Portfolio giúp mình hệ thống lại toàn bộ học phần Kỹ năng số qua sáu bài tập: quản lý tệp tin, tìm kiếm và đánh giá thông tin, viết Prompt, hợp tác nhóm trực tuyến, sáng tạo nội dung bằng AI và sử dụng AI có trách nhiệm. Là sinh viên Sư phạm Âm nhạc, ban đầu mình nghĩ kỹ năng số khá xa với chuyên môn. Qua từng bài, mình nhận ra công nghệ có thể hỗ trợ trực tiếp việc tìm tài liệu, soạn giáo án và thiết kế bài giảng âm nhạc.</p></div>'
+'<div class="sec"><h2>Kiến thức và kỹ năng quan trọng nhất</h2><ul><li>Quản lý tệp tin và thư mục khoa học: tạo, đổi tên, sao chép, di chuyển, xóa, khôi phục và đặt tên tệp rõ ràng.</li><li>Tìm kiếm tài liệu học thuật bằng toán tử nâng cao trên Google Scholar và đánh giá độ tin cậy của nguồn theo 5 tiêu chí.</li><li>Viết Prompt rõ ràng, cụ thể để AI cho kết quả đúng nhu cầu, như bộ câu hỏi trắc nghiệm về cung và quãng.</li><li>Làm việc nhóm trực tuyến: lập kế hoạch cuộc họp và phân công nhiệm vụ cho từng cá nhân.</li><li>Sử dụng AI có trách nhiệm: minh bạch, trung thực, kiểm chứng thông tin, bảo mật dữ liệu và giữ tư duy độc lập.</li></ul></div>'
+'<div class="sec"><h2>Điểm tâm đắc và thách thức</h2><p>Điều mình tâm đắc nhất là cách viết Prompt: khi nêu rõ yêu cầu, số lượng và định dạng, AI tạo ra bộ câu hỏi nhạc lý sát nhu cầu hơn nhiều so với một câu lệnh ngắn, và mình có thể dùng lại cho việc ôn tập và giảng dạy sau này. Thách thức lớn nhất là việc mình chưa thường xuyên sử dụng và chưa thành thạo các thao tác quản lý tệp tin trên máy tính. Nhờ tìm hiểu hướng dẫn và thực hành trực tiếp, mình đã hiểu rõ hơn cách tổ chức, sắp xếp và quản lý dữ liệu. Mình cũng rút ra rằng AI chỉ là công cụ hỗ trợ: thông tin cần được kiểm chứng và người dùng vẫn là người chịu trách nhiệm cuối cùng.</p></div>'
+'<h2>Các bài tập đã hoàn thành</h2><div class="list">';
  EX.forEach(function(e,i){h+='<a class="item" href="#bai-'+(i+1)+'"><span class="n">'+(i+1)+'</span><span><b>'+esc(e.t)+'</b><small>'+esc(e.c.split(":")[0])+'</small></span></a>'});
  return h+'</div>'}
function route(){
  var k=(location.hash||"#about").slice(1),m=$("main"),html;
  if(k=="projects")html=projects();else if(k=="conclusion")html=conclusion();
  else if(/^bai-[1-6]$/.test(k))html=ex(+k.slice(4)-1);else{k="about";html=about()}
  m.innerHTML=html;buildNav(k);
  var t={about:"Giới thiệu",projects:"Dự án",conclusion:"Tổng kết"}[k]||("Bài "+k.slice(4));
  document.title=t+" | "+ME.name;
  $("side").classList.remove("open");$("menu").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}
$("menu").onclick=function(){var o=$("side").classList.toggle("open");this.setAttribute("aria-expanded",o)};
if($("theme"))$("theme").onclick=function(){var r=document.documentElement,d=r.getAttribute("data-theme")=="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",d?"light":"dark")};
document.addEventListener("click",function(e){var d=document.querySelector(".dd");if(!d)return;var b=$("ddbtn");if(b&&b.contains(e.target)){b.setAttribute("aria-expanded",d.classList.toggle("open"))}else if(!d.contains(e.target)||e.target.closest(".dd-menu a")){d.classList.remove("open");if(b)b.setAttribute("aria-expanded","false")}});
document.addEventListener("keydown",function(e){if(e.key=="Escape"){var d=document.querySelector(".dd");if(d)d.classList.remove("open")}});
window.addEventListener("hashchange",route);route();
</script>
